<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show do Bacharel - Ed. Física</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2e;
            --accent-yellow: #f1c40f;
            --accent-blue: #2980b9;
            --text-color: #ffffff;
            --correct-color: #27ae60;
            --wrong-color: #c0392b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #2c3e50;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--accent-yellow);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.3);
            padding: 15px 20px;
            border-radius: 10px;
        }

        .prize-box {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .question-box {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 25px;
            border-left: 6px solid var(--accent-blue);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #24334a;
            color: #fff;
            border: 2px solid #334e68;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background: #334e68;
            border-color: var(--accent-yellow);
        }

        .option-btn .letter {
            background: var(--accent-yellow);
            color: #000;
            font-weight: bold;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .option-btn.correct {
            background: var(--correct-color) !important;
            border-color: #2ec4b6 !important;
        }

        .option-btn.wrong {
            background: var(--wrong-color) !important;
            border-color: #e74c3c !important;
        }

        .helpers {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .help-btn {
            background: #2b3a4a;
            color: #fff;
            border: 1px solid var(--accent-yellow);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .help-btn:hover:not(:disabled) {
            background: var(--accent-yellow);
            color: #000;
        }

        .help-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .start-screen, .end-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .main-btn {
            background: var(--accent-yellow);
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        .main-btn:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--accent-yellow);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Tela Inicial -->
        <div id="start-screen" class="screen active start-screen">
            <h1>Show do Bacharel</h1>
            <p style="margin-top: 15px; color: #a0aec0;">Teste seus conhecimentos em Musculação, Fisiologia, Biomecânica e Cinesiologia!</p>
            <button class="main-btn" onclick="startGame()">Iniciar Jogo</button>
        </div>

        <!-- Tela do Jogo -->
        <div id="game-screen" class="screen">
            <header>
                <h1>Show do Bacharel</h1>
            </header>

            <div class="status-bar">
                <span id="question-number">Pergunta 1/10</span>
                <span id="prize" class="prize-box">Prêmio: R$ 1.000</span>
            </div>

            <div class="question-box" id="question-text">
                Carregando pergunta...
            </div>

            <div class="options-grid" id="options-container">
                <!-- As opções serão inseridas via JavaScript -->
            </div>

            <div class="helpers">
                <button id="btn-cards" class="help-btn" onclick="useCards()">Eliminar 2 Erradas</button>
                <button id="btn-students" class="help-btn" onclick="useStudents()">Platéia Universitária</button>
            </div>
        </div>

        <!-- Tela do Fim do Jogo -->
        <div id="end-screen" class="screen end-screen">
            <h2 id="end-title" style="font-size: 2.5rem; margin-bottom: 15px;">Fim de Jogo!</h2>
            <p id="end-message" style="font-size: 1.2rem; color: #a0aec0; margin-bottom: 20px;"></p>
            <h3 id="final-prize" style="color: var(--accent-yellow); font-size: 2rem;">R$ 0</h3>
            <button class="main-btn" onclick="startGame()">Jogar Novamente</button>
        </div>
    </div>

    <!-- Modal para Ajuda da Platéia -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color: var(--accent-yellow);">Opinião dos Universitários</h3>
            <p id="modal-text" style="line-height: 1.6;"></p>
            <button class="main-btn" style="padding: 8px 25px; font-size: 1rem;" onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <script>
        // Banco de perguntas focado em nível superior de Educação Física
        const questions = [
            {
                question: "Durante a fase concêntrica do exercício Agachamento Livre, qual é a ação articular primária ocorrida no quadril e qual músculo atua como agonista principal?",
                options: [
                    "Flexão de quadril / Iliopsoas",
                    "Extensão de quadril / Glúteo Máximo",
                    "Adução de quadril / Adutor Magno",
                    "Rotação Lateral / Piriforme"
                ],
                correct: 1
            },
            {
                question: "Qual mecanismo fisiológico explica o aumento inicial de força muscular nas primeiras semanas de treinamento resistido em indivíduos destreinados?",
                options: [
                    "Hipertrofia miofibrilar acentuada",
                    "Hiperplasia das fibras musculares",
                    "Adaptações neurais (maior recrutamento de unidades motoras)",
                    "Aumento expressivo do retículo sarcoplasmático"
                ],
                correct: 2
            },
            {
                question: "Qual das alternativas define corretamente o conceito de Insuficiência Ativa de um músculo biarticular?",
                options: [
                    "Incapacidade de gerar força máxima quando encurtado simultaneamente sobre ambas as articulações.",
                    "Falta de flexibilidade passiva quando o músculo é alongado ao máximo.",
                    "Fadiga precoce causada pelo acúmulo excessivo de lactato.",
                    "Incapacidade do músculo de relaxar após uma contração tetânica."
                ],
                correct: 0
            },
            {
                question: "Qual é o principal substrato energético utilizado durante uma série intensa de 8 repetições máximas (10-15 segundos de duração) na musculação?",
                options: [
                    "Glicose via fosforilação oxidativa",
                    "Ácidos graxos livres via Beta-oxidação",
                    "Fosfocreatina (Sistema ATP-CP)",
                    "Aminoácidos de cadeia ramificada (BCAA)"
                ],
                correct: 2
            },
            {
                question: "Ao realizar a rosca direta com barra reta, qual músculo atua como sinergista auxiliando o bíceps braquial e mantendo eficiência mecânica em supinação?",
                options: [
                    "Tríceps Braquial",
                    "Braquiorradial",
                    "Coracobraquial",
                    "Deltoide Anterior"
                ],
                correct: 1
            },
            {
                question: "Qual é o efeito do treinamento de força sobre a rigidez (stiffness) do tecido conjuntivo (tendões)?",
                options: [
                    "Diminui a rigidez, tornando o tendão mais complacente e suscetível a lesões.",
                    "Aumenta a rigidez tendínea, melhorando a transmissão de força ossea/muscular.",
                    "Não produz nenhuma alteração estrutural no colágeno tendíneo.",
                    "Degrada as fibras de colágeno tipo I substituindo por colágeno tipo III."
                ],
                correct: 1
            },
            {
                question: "No exercício Elevação Lateral para ombros, em qual plano de movimento a abdução do ombro é realizada predominantemente?",
                options: [
                    "Plano Sagital",
                    "Plano Transverso",
                    "Plano Frontal (Coronal)",
                    "Plano Oblíquo Medial"
                ],
                correct: 2
            },
            {
                question: "Qual das seguintes respostas hormonais agudas é tipicamente observada após um treino intensivo de musculação com alto volume e intervalos curtos?",
                options: [
                    "Elevação temporária dos níveis de GH e Cortisol",
                    "Supressão total da Insulina e da Testosterona por 48 horas",
                    "Aumento da Melatonina e diminuição da Adrenalina",
                    "Inibição da secreção do Glucagon"
                ],
                correct: 0
            },
            {
                question: "Segundo a lei de Henneman (Princípio do Tamanho), como é feita a ordem de recrutamento das unidades motoras durante a elevação progressiva de carga?",
                options: [
                    "Unidades motoras grandes (Fibras Tipo II) são recrutadas primeiro.",
                    "O recrutamento ocorre de forma aleatória, independente da exigência de força.",
                    "Unidades motoras pequenas (Fibras Tipo I) são recrutadas primeiro, seguidas pelas Tipo II.",
                    "Apenas unidades motoras Tipo IIx são acionadas em treinos de musculação."
                ],
                correct: 2
            },
            {
                question: "Qual variável biomecânica é alterada ao mudar a pegada na Puxada Alta de pronada para supinada?",
                options: [
                    "Aumento significativo do momento extensor no joelho.",
                    "Maior participação mecânica do flexor de cotovelo (bíceps) e alteração na amplitude de extensão do ombro.",
                    "Isolamento completo do músculo Latíssimo do Dorso.",
                    "Eliminação da rotação inferior da escápula."
                ],
                correct: 1
            }
        ];

        const prizePrizes = [
            "R$ 1.000", "R$ 5.000", "R$ 10.000", "R$ 50.000", "R$ 100.000", 
            "R$ 300.000", "R$ 500.000", "R$ 800.000", "R$ 900.000", "R$ 1.000.000"
        ];

        let currentQuestion = 0;
        let cardsUsed = false;
        let studentsUsed = false;
        let acceptAnswers = true;

        function startGame() {
            currentQuestion = 0;
            cardsUsed = false;
            studentsUsed = false;
            
            document.getElementById("btn-cards").disabled = false;
            document.getElementById("btn-students").disabled = false;
            
            showScreen("game-screen");
            loadQuestion();
        }

        function showScreen(screenId) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(screenId).classList.add("active");
        }

        function loadQuestion() {
            acceptAnswers = true;
            const q = questions[currentQuestion];
            
            document.getElementById("question-number").innerText = `Pergunta ${currentQuestion + 1}/${questions.length}`;
            document.getElementById("prize").innerText = `Prêmio: ${prizePrizes[currentQuestion]}`;
            document.getElementById("question-text").innerText = q.question;

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            const letters = ["A", "B", "C", "D"];
            q.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.onclick = () => checkAnswer(index);
                btn.innerHTML = `<span class="letter">${letters[index]}</span> ${opt}`;
                container.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            if (!acceptAnswers) return;
            acceptAnswers = false;

            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll(".option-btn");

            if (selectedIndex === q.correct) {
                buttons[selectedIndex].classList.add("correct");
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion < questions.length) {
                        loadQuestion();
                    } else {
                        endGame(true);
                    }
                }, 1500);
            } else {
                buttons[selectedIndex].classList.add("wrong");
                buttons[q.correct].classList.add("correct");
                setTimeout(() => {
                    endGame(false);
                }, 2000);
            }
        }

        function useCards() {
            if (cardsUsed || !acceptAnswers) return;
            cardsUsed = true;
            document.getElementById("btn-cards").disabled = true;

            const q = questions[currentQuestion];
            const buttons = document.querySelectorAll(".option-btn");
            let removed = 0;

            buttons.forEach((btn, index) => {
                if (index !== q.correct && removed < 2) {
                    btn.style.visibility = "hidden";
                    removed++;
                }
            });
        }

        function useStudents() {
            if (studentsUsed || !acceptAnswers) return;
            studentsUsed = true;
            document.getElementById("btn-students").disabled = true;

            const q = questions[currentQuestion];
            const letters = ["A", "B", "C", "D"];
            
            // Simula alta chance de acerto dos universitários de Ed. Física
            let stats = [10, 10, 10, 10];
            stats[q.correct] = 70;

            let msg = "A maioria dos universitários de Educação Física respondeu:<br><br>";
            letters.forEach((l, i) => {
                msg += `<b>Opção ${l}:</b> ${stats[i]}% das escolhas<br>`;
            });

            document.getElementById("modal-text").innerHTML = msg;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        function endGame(winner) {
            showScreen("end-screen");
            const title = document.getElementById("end-title");
            const msg = document.getElementById("end-message");
            const prize = document.getElementById("final-prize");

            if (winner) {
                title.innerText = "Parabéns, Bacharel!";
                title.style.color = "var(--accent-yellow)";
                msg.innerText = "Você domina os conceitos da Educação Física e conquistou o prêmio máximo!";
                prize.innerText = prizePrizes[questions.length - 1];
            } else {
                title.innerText = "Fim de Jogo!";
                title.style.color = "var(--wrong-color)";
                msg.innerText = "Você errou a resposta. Continue estudando os livros de Fisiologia e Biomecânica!";
                
                const earned = currentQuestion > 0 ? prizePrizes[currentQuestion - 1] : "R$ 0";
                prize.innerText = `Você saiu com: ${earned}`;
            }
        }
    </script>
</body>
</html>
